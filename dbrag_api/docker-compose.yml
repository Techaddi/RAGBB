services:
  api:
    build: .
    env_file: .env
    environment:
      LLM_BASE_URL: http://ollama:11434
    ports: ["8000:8000"]
    depends_on: [ollama]
    restart: unless-stopped
    volumes:
      - chroma:/srv/data/chroma

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # GPU (NVIDIA) - strongly recommended; uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    # first run:  docker compose exec ollama ollama pull qwen2.5-coder:7b

volumes:
  chroma:
  ollama:
